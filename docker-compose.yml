version: "3.9"

services:
  nextcms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextcms_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://nextcms:nextcms_pass@nextcms-db:5432/nextcms
      - AUTH_SECRET=UvSFNVODBAncBsZIqtcjs/j7yTDh3nEHMY6a2lpv5Gs=
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
      - SITE_URL=http://localhost:3000
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=nextcms
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true
      - S3_REGION=us-east-1
    depends_on:
      nextcms-db:
        condition: service_healthy
    networks:
      - nextcms-network

  nextcms-db:
    image: postgres:15
    container_name: nextcms_db
    restart: always
    environment:
      POSTGRES_USER: nextcms
      POSTGRES_PASSWORD: nextcms_pass
      POSTGRES_DB: nextcms
    ports:
      - "5432:5432"
    volumes:
      - nextcms_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcms -d nextcms"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nextcms-network

  minio:
    image: minio/minio:latest
    container_name: nextcms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - nextcms-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: nextcms_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nextcms.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - nextcms-db
    networks:
      - nextcms-network

volumes:
  nextcms_data:
  minio_data:

networks:
  nextcms-network:
    driver: bridge
